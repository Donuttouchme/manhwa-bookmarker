name: Deploy production

on:
  push:
    branches: [main]

concurrency:
  group: prod-deploy
  cancel-in-progress: false # never cancel a prod deploy mid-flight

jobs:
  migrate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    steps:
      - uses: actions/checkout@v6

      # ─── Secrets gate ─────────────────────────────────
      # Secrets can't be checked in `if:` expressions directly.
      # Map them to env vars, then inspect the env vars in a shell step.
      - name: Check secrets present
        id: check
        env:
          _FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          _PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          if [ -z "${_FLY_API_TOKEN}" ] || [ -z "${_PROD_DATABASE_URL}" ]; then
            echo "secrets-missing=true" >> $GITHUB_OUTPUT
            echo "::warning::Required secrets (FLY_API_TOKEN, PROD_DATABASE_URL) are not set — deploy steps will be skipped. Add them in GitHub → Settings → Secrets → Actions."
          else
            echo "secrets-missing=false" >> $GITHUB_OUTPUT
          fi

      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: steps.check.outputs.secrets-missing != 'true'

      # ─── Migrations ────────────────────────────────────
      - name: Apply migrations to prod
        if: steps.check.outputs.secrets-missing != 'true'
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          npm install -g pnpm@9.15.0
          pnpm install --frozen-lockfile --filter @manhwa/db
          pnpm --filter @manhwa/db exec prisma migrate deploy

      # ─── Deploy web ────────────────────────────────────
      - name: Deploy web (prod)
        if: steps.check.outputs.secrets-missing != 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          fly deploy --config apps/web/fly.prod.toml --remote-only \
            --build-arg NEXT_PUBLIC_SENTRY_DSN="${{ secrets.PROD_NEXT_PUBLIC_SENTRY_DSN }}" \
            --build-arg SENTRY_DSN="${{ secrets.PROD_SENTRY_DSN }}" \
            --build-arg SENTRY_AUTH_TOKEN="${{ secrets.SENTRY_AUTH_TOKEN }}" \
            --build-arg SENTRY_ORG="${{ secrets.SENTRY_ORG }}" \
            --build-arg SENTRY_PROJECT="manhwa-web-prod"

      # ─── Deploy worker ────────────────────────────────
      - name: Deploy worker (prod)
        if: steps.check.outputs.secrets-missing != 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: fly deploy --config apps/worker/fly.prod.toml --remote-only
