name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: manhwa
          POSTGRES_PASSWORD: manhwa_dev_password
          POSTGRES_DB: manhwa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U manhwa -d manhwa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      suwayomi:
        image: ghcr.io/suwayomi/suwayomi-server:stable
        ports:
          - 4567:4567
        env:
          BIND_PORT: '4567'
          BIND_IP: '0.0.0.0'
          DOWNLOAD_AS_CBZ: 'false'
          AUTO_DOWNLOAD_CHAPTERS: 'false'
          EXTENSION_REPOS: '["https://raw.githubusercontent.com/keiyoushi/extensions/main/index.min.json"]'

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        env:
          DATABASE_URL: postgresql://manhwa:manhwa_dev_password@localhost:5432/manhwa
        run: pnpm --filter @manhwa/db exec prisma generate

      - name: Wait for Suwayomi to boot
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4567 > /dev/null; then
              echo "Suwayomi up after ${i}s"
              exit 0
            fi
            sleep 2
          done
          echo "Suwayomi never started" >&2
          exit 1

      - name: Wait for Suwayomi extension catalog
        run: |
          # fetchExtensions fetches from the remote Keiyoushi catalog — it can return 0
          # if Suwayomi hasn't loaded the catalog yet. Poll until we get >0 extensions.
          for i in $(seq 1 30); do
            RESPONSE=$(curl -sf -X POST http://localhost:4567/api/graphql \
              -H 'Content-Type: application/json' \
              -d '{"query":"mutation { fetchExtensions(input: {}) { extensions { pkgName } } }"}' || echo '{}')
            COUNT=$(echo "${RESPONSE}" | python3 -c "import sys,json; d=json.load(sys.stdin); print(len(d.get('data',{}).get('fetchExtensions',{}).get('extensions',[])))" 2>/dev/null || echo 0)
            if [ "${COUNT}" -gt 0 ]; then
              echo "Catalog loaded: ${COUNT} extensions after ${i}x3s"
              exit 0
            fi
            echo "Attempt ${i}: got ${COUNT} extensions. Raw (first 200 chars): ${RESPONSE:0:200}"
            sleep 3
          done
          echo "Suwayomi catalog never loaded extensions" >&2
          exit 1

      - name: Install Suwayomi extensions
        env:
          SUWAYOMI_URL: http://localhost:4567
        run: pnpm worker:install-extensions:ci

      - name: Wait for Bbato source to activate
        run: |
          # After installing, Suwayomi must reload the extension APK.
          # Poll the sources GQL endpoint until Bbato appears (or 60s timeout).
          for i in $(seq 1 30); do
            FOUND=$(curl -sf -X POST http://localhost:4567/api/graphql \
              -H 'Content-Type: application/json' \
              -d '{"query":"{ sources { nodes { name } } }"}' \
              | python3 -c "import sys,json; d=json.load(sys.stdin); srcs=d.get('data',{}).get('sources',{}).get('nodes',[]); print(any(s.get('name')=='Bbato' for s in srcs))" 2>/dev/null || echo False)
            if [ "${FOUND}" = "True" ]; then
              echo "Bbato source active after ${i}x2s"
              exit 0
            fi
            sleep 2
          done
          echo "Bbato source never became active — extensions may need a longer warm-up" >&2
          exit 1

      - name: Prisma migrate
        env:
          DATABASE_URL: postgresql://manhwa:manhwa_dev_password@localhost:5432/manhwa
        run: pnpm --filter @manhwa/db exec prisma migrate deploy

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        env:
          DATABASE_URL: postgresql://manhwa:manhwa_dev_password@localhost:5432/manhwa
          SUWAYOMI_URL: http://localhost:4567
          AUTH_SECRET: ci-fake-secret-for-deterministic-tests
          AUTH_URL: http://localhost:3000
          EMAIL_SERVER_HOST: localhost
          EMAIL_SERVER_PORT: '1025'
          EMAIL_SERVER_USER: ci
          EMAIL_SERVER_PASSWORD: ci
          EMAIL_FROM: noreply@ci.invalid
        run: pnpm test

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
